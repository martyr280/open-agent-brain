# Agent registry. One identity per human, agent, and ingestor.
# Keys are never stored here, only key_sha256. Issue or rotate a key with:
#   brain agent add <id> --vendor <vendor> --rotate     (prints the key once)
# Limit an agent to some customers with --customers slug1,slug2.
agents:
- id: owner
  vendor: human
  kind: human
  operator: owner
  description: The operator who owns this brain (rename to your handle)
  scopes:
  - read
  - write
  customers:
  - '*'
- id: claude-desktop
  vendor: anthropic
  kind: agent
  operator: owner
  description: Claude app (claude.ai / desktop)
  scopes:
  - read
  - write
  customers:
  - '*'
- id: claude-code
