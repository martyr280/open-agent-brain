name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # A push of exactly one gateway commit was validated server-side; skip it to save Actions
    # minutes. Everything else is validated here, and brain-cron re-validates hourly from a
    # checkpoint (the brain-validated tag), so a skipped or forged push is still caught.
    if: >-
      github.event_name == 'pull_request' ||
      github.event.head_commit.author.email != 'brain-gateway@users.noreply.github.com' ||
      github.event.commits[1] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit and integration tests
        run: pytest -q
      - name: Validate events (schema, paths, secrets, immutability)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            brain validate --immutable-against "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            brain validate --immutable-against "$BEFORE"
          else
            brain validate
          fi
